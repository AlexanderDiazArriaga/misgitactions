name: GitHub Actions Practica
on: [push]
jobs:
  Explorando-GitHub-Actions:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Evento ${{ github.event_name }}"
      - run: echo "SO ${{ runner.os }}"
      - run: echo "Rama ${{ github.ref }}"
      - name: Checkout
        uses: actions/checkout@v2
      - run: echo "Repositorio clonado."
      - name: Listar archivos
        run: ls ${{ github.workspace }}
      - run: echo "Estado ${{ job.status }}."
